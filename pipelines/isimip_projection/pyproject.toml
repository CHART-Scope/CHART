[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isimip-projection"
version = "0.1.0"
description = "ISIMIP3b long-term temperature projection adapter for CHART."
requires-python = ">=3.11"
dependencies = [
  "isimip-client>=2.0.2",
  "numpy>=1.26",
  "netCDF4>=1.7",
  "shapely>=2.0",
  "xarray>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["isimip_projection*"]
