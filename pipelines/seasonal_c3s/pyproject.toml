[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seasonal-c3s"
version = "0.1.0"
description = "C3S seasonal temperature adapter for CHART."
requires-python = ">=3.11"
dependencies = [
  "cdsapi>=0.7",
  "numpy>=1.26",
  "netCDF4>=1.7",
  "pandas>=2.0",
  "shapely>=2.0",
  "xarray>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["seasonal_c3s*"]
