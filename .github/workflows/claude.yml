name: Claude

# Claude Code on Amazon Bedrock: an automatic review of every pull request, and
# answers to @claude in pull request and issue comments. AWS access comes from
# GitHub OIDC (no stored AWS keys); comments are posted as the CHART GitHub App.
# Setup: docs/claude-review.md. Until AWS_CLAUDE_ROLE_ARN is set, both jobs skip.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

env:
  AWS_REGION: eu-north-1
  CLAUDE_MODEL: ${{ vars.CLAUDE_BEDROCK_MODEL || 'eu.anthropic.claude-opus-5-5' }}

jobs:
  review:
    name: Review
    if: >-
      vars.AWS_CLAUDE_ROLE_ARN != '' &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CLAUDE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against AGENTS.md and docs/design-system.md.
            Report only real problems: correctness bugs, missing role, workspace
            or geography permission checks, unsafe migrations or data loss,
            secrets in code or logs, and missing E2E coverage for changed
            behaviour. Skip style nits the formatters already enforce.
            Put each finding as an inline comment on the line it concerns, then
            one short summary comment with `gh pr comment`. If nothing is wrong,
            say so in one line.
          claude_args: >-
            --model ${{ env.CLAUDE_MODEL }}
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    name: Answer @claude
    if: >-
      vars.AWS_CLAUDE_ROLE_ARN != '' &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CLAUDE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          claude_args: >-
            --model ${{ env.CLAUDE_MODEL }}
            --max-turns 30
