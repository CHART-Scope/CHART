name: Python API

on:
  pull_request:
    paths:
      - ".github/workflows/api.yml"
      - "backend/**"
      - "orchestration/**"
      - "pipelines/**"
      - "infra/**"
      - "Makefile"
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/api.yml"
      - "backend/**"
      - "orchestration/**"
      - "pipelines/**"
      - "infra/**"
      - "Makefile"
  workflow_dispatch:

concurrency:
  group: chart-python-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: chart
          POSTGRES_USER: chart
          POSTGRES_PASSWORD: chart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chart -d chart"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and data packages
        run: >-
          python -m pip install -e 'backend[dev]' -e 'pipelines/era5_heat[dev]'
          -e 'pipelines/seasonal_c3s[dev]' -e 'pipelines/boundaries[dev]'
          -e 'pipelines/isimip_projection[dev]'
          -e orchestration
      - name: Apply the only application migration chain
        env:
          DATABASE_URL: postgresql+psycopg://chart:chart@127.0.0.1:5432/chart
        run: backend/scripts/migrate.sh
      - name: Test API, orchestration, and source adapters
        env:
          DATABASE_URL: postgresql+psycopg://chart:chart@127.0.0.1:5432/chart
        run: python -m pytest backend/tests orchestration/tests pipelines/era5_heat/tests pipelines/seasonal_c3s/tests pipelines/isimip_projection/tests pipelines/boundaries/tests pipelines/LBW_demo/tests -q
      - name: Check deploy script
        run: bash -n infra/aws/deploy-app.sh
