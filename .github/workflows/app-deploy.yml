name: App Deploy

on:
  pull_request:
    paths:
      - ".github/workflows/app-deploy.yml"
      - ".dockerignore"
      - ".prettierignore"
      - ".prettierrc.json"
      - "backend/**"
      - "docs/climate-api.md"
      - "docs/data-pipeline.md"
      - "docs/openapi/climate.json"
      - "infra/**"
      - "Makefile"
      - "orchestration/**"
      - "package.json"
      - "package-lock.json"
      - "pipelines/**"
      - "web/**"
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/app-deploy.yml"
      - ".dockerignore"
      - ".prettierignore"
      - ".prettierrc.json"
      - "backend/**"
      - "docs/climate-api.md"
      - "docs/data-pipeline.md"
      - "docs/openapi/climate.json"
      - "infra/**"
      - "Makefile"
      - "orchestration/**"
      - "package.json"
      - "package-lock.json"
      - "pipelines/**"
      - "web/**"
  workflow_dispatch:

concurrency:
  group: chart-app-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: chart
          POSTGRES_USER: chart
          POSTGRES_PASSWORD: chart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chart -d chart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://chart:chart@127.0.0.1:5432/chart
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx prettier --check .github README.md infra web/src web/.storybook web/*.json web/*.mjs web/*.ts package.json
      - run: npm run identity:test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: >-
          python -m pip install -e 'backend[dev]' -e 'pipelines/era5_heat[dev]'
          -e 'pipelines/seasonal_c3s[dev]' -e 'pipelines/boundaries[dev]'
          -e 'pipelines/isimip_projection[dev]' -e orchestration

      - name: Check Python formatting, lint, and types
        run: make python-check VENV_PYTHON=python

      - name: Validate database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://chart:chart@127.0.0.1:5432/chart
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Test Python application and pipelines
        run: python -m pytest backend/tests orchestration/tests pipelines/era5_heat/tests pipelines/seasonal_c3s/tests pipelines/isimip_projection/tests pipelines/boundaries/tests -q

      - name: Validate Dagster and OpenAPI contracts
        run: |
          python -c 'import dagster as dg; from chart_pipeline.definitions import defs; dg.Definitions.validate_loadable(defs)'
          python -m chart.api.export_openapi --output docs/openapi/climate.json
          git diff --exit-code docs/openapi/climate.json

      - run: npm run typecheck:web
      - run: npm run build:web

      - name: Validate deployment configuration
        env:
          PUBLIC_ORIGIN: http://example.test
          POSTGRES_PASSWORD: test-password
          KEYCLOAK_ADMIN_PASSWORD: test-password
          CHART_BOOTSTRAP_TOKEN: test-token
          MODEL_CONTROL_TOKEN: test-token
        run: |
          IMAGE_PREFIX=ghcr.io/chart-scope/chart IMAGE_TAG=test docker compose -f infra/aws/docker-compose.yml config -q
          docker run --rm -e PUBLIC_ORIGIN -v "$PWD/infra/aws/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Validate deploy images on pull requests
        if: github.event_name == 'pull_request'
        run: |
          docker build -f backend/Dockerfile -t chart-python:ci .
          docker build --build-arg "CHART_BUILD_ID=$GITHUB_SHA" -f web/Dockerfile -t chart-web:ci .
          docker build --target test -f pipelines/models/Dockerfile -t chart-lbw:ci pipelines/models
          docker run --rm chart-python:ci python -c 'from chart.api.app import app; assert "/climate/predict" in app.openapi()["paths"]'

  publish:
    name: Build and publish images
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.image.outputs.prefix }}
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image names
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push Python image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-python:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}-python:dev
          cache-from: type=gha,scope=python
          cache-to: type=gha,mode=max,scope=python

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          build-args: CHART_BUILD_ID=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.prefix }}-web:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}-web:dev
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push model image
        uses: docker/build-push-action@v6
        with:
          context: pipelines/models
          target: final
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-lbw:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}-lbw:dev
          cache-from: type=gha,scope=lbw
          cache-to: type=gha,mode=max,scope=lbw

  deploy:
    name: Deploy to EC2
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Copy Compose configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.AWS_APP_HOST }}
          username: ${{ secrets.AWS_APP_USER }}
          key: ${{ secrets.AWS_APP_SSH_KEY }}
          source: "infra/aws,infra/keycloak"
          target: /opt/chart-deploy
          strip_components: 1
          overwrite: true

      - name: Prepare runtime environment
        env:
          CHART_RUNTIME_ENV: ${{ secrets.CHART_RUNTIME_ENV }}
        run: |
          if [ -z "$CHART_RUNTIME_ENV" ]; then
            echo "::error title=Missing deployment configuration::CHART_RUNTIME_ENV is required"
            exit 1
          fi
          runtime_env="$(mktemp)"
          trap 'rm -f "$runtime_env"' EXIT
          printf '%s' "$CHART_RUNTIME_ENV" > "$runtime_env"
          public_origin="$(docker compose --env-file "$runtime_env" -f infra/aws/docker-compose.yml config --format json | jq -r '.services["chart-caddy"].environment.PUBLIC_ORIGIN // empty')"
          if [[ ! "$public_origin" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]]; then
            echo "::error title=Invalid runtime setting::PUBLIC_ORIGIN must be an HTTP(S) origin without a path"
            exit 1
          fi
          runtime_env_b64="$(printf '%s' "$CHART_RUNTIME_ENV" | base64 -w 0)"
          echo "::add-mask::$runtime_env_b64"
          echo "AWS_APP_PUBLIC_ORIGIN=$public_origin" >> "$GITHUB_ENV"
          echo "CHART_RUNTIME_ENV_B64=$runtime_env_b64" >> "$GITHUB_ENV"

      - name: Pull and start release
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.AWS_APP_HOST }}
          username: ${{ secrets.AWS_APP_USER }}
          key: ${{ secrets.AWS_APP_SSH_KEY }}
          command_timeout: 30m
          envs: GHCR_TOKEN,GHCR_USER,CHART_RUNTIME_ENV_B64
          script: |
            set -euo pipefail
            cd /opt/chart-deploy/aws
            runtime_env="$(mktemp /dev/shm/chart-env.XXXXXX)"
            docker_config="$(mktemp -d /dev/shm/chart-docker.XXXXXX)"
            trap 'rm -rf "$runtime_env" "$docker_config"' EXIT
            printf '%s' "$CHART_RUNTIME_ENV_B64" | base64 -d > "$runtime_env"
            chmod 600 "$runtime_env"
            printf '%s' "$GHCR_TOKEN" | DOCKER_CONFIG="$docker_config" docker login ghcr.io -u "$GHCR_USER" --password-stdin
            IMAGE_PREFIX="${{ needs.publish.outputs.image_prefix }}" IMAGE_TAG="${{ needs.publish.outputs.image_tag }}" DOCKER_CONFIG="$docker_config" docker compose --env-file "$runtime_env" pull
            if docker inspect chart-postgres >/dev/null 2>&1; then
              compose_owner="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' chart-postgres 2>/dev/null || true)"
              if [ "$compose_owner" != "chart" ]; then
                docker rm -f chart-proxy chart-web chart-api chart-climate-api chart-new-design chart-dagster-webserver chart-dagster-daemon chart-lbw chart-keycloak chart-keycloak-postgres chart-postgres 2>/dev/null || true
              fi
            fi
            IMAGE_PREFIX="${{ needs.publish.outputs.image_prefix }}" IMAGE_TAG="${{ needs.publish.outputs.image_tag }}" DOCKER_CONFIG="$docker_config" docker compose --env-file "$runtime_env" up -d --wait --remove-orphans

      - name: Verify public release
        if: env.AWS_APP_PUBLIC_ORIGIN != ''
        run: |
          for attempt in $(seq 1 12); do
            build_id="$(curl -fsS --connect-timeout 5 --max-time 15 "$AWS_APP_PUBLIC_ORIGIN/api/build" | jq -r .buildId || true)"
            api_status="$(curl -fsS --connect-timeout 5 --max-time 15 "$AWS_APP_PUBLIC_ORIGIN/chart-api/ready" | jq -r .status || true)"
            if [ "$build_id" = "$GITHUB_SHA" ] && [ "$api_status" = "ok" ]; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Show deployment diagnostics
        if: failure() && env.CHART_RUNTIME_ENV_B64 != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_APP_HOST }}
          username: ${{ secrets.AWS_APP_USER }}
          key: ${{ secrets.AWS_APP_SSH_KEY }}
          envs: CHART_RUNTIME_ENV_B64
          script: |
            set -u
            cd /opt/chart-deploy/aws
            runtime_env="$(mktemp /dev/shm/chart-env.XXXXXX)"
            trap 'rm -f "$runtime_env"' EXIT
            printf '%s' "$CHART_RUNTIME_ENV_B64" | base64 -d > "$runtime_env"
            chmod 600 "$runtime_env"
            IMAGE_PREFIX="${{ needs.publish.outputs.image_prefix }}" IMAGE_TAG="${{ needs.publish.outputs.image_tag }}" docker compose --env-file "$runtime_env" ps -a
            IMAGE_PREFIX="${{ needs.publish.outputs.image_prefix }}" IMAGE_TAG="${{ needs.publish.outputs.image_tag }}" docker compose --env-file "$runtime_env" logs --tail 100
