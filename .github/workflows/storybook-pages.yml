name: Project Pages

on:
  # Only what the published site shows: the stories and their shared UI, and
  # the docs. A feature-only change (dashboard logic, say) does not redeploy;
  # its story refreshes with the next story or shared-component change.
  pull_request:
    paths: &site-paths
      - ".github/workflows/storybook-pages.yml"
      - "package.json"
      - "package-lock.json"
      - "web/package.json"
      - "web/tsconfig.json"
      - "web/.storybook/**"
      - "web/public/**"
      - "web/src/**/*.stories.*"
      - "web/src/foundations/**"
      - "web/src/components/**"
      - "web/src/styles/**"
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/check_docs_links.py"
  push:
    branches:
      - main
      - dev
    paths: *site-paths
  workflow_dispatch:

concurrency:
  group: chart-storybook-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build project site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build Storybook
        run: npm run build-storybook:web
        env:
          STORYBOOK_BASE_URL: ${{ steps.pages.outputs.base_path }}

      - name: Build documentation
        run: python -m mkdocs build --strict --site-dir web/storybook-static/docs

      - name: Check documentation links
        run: python scripts/check_docs_links.py web/storybook-static/docs

      - name: Upload project site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/storybook-static

  deploy:
    name: Deploy project site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
