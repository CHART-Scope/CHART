[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chart"
version = "0.1.0"
description = "CHART Python core shared modules (schema owner for SQLAlchemy)."
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.8.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "geoalchemy2>=0.15",
  "fastapi>=0.115",
  "PyJWT[crypto]>=2.9",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
chart-load-mp-boundaries = "chart.geographies.cli:main"
chart-register-model-release = "chart.model_registry.cli:main"
chart-bootstrap-mp = "chart.bootstrap:main"
chart-admin-recover = "chart.identity.cli:main"
chart-purge-audit-events = "chart.audit.retention:main"
chart-import-handover = "chart.heat_outlook.handover:main"
chart-register-outlook-geographies = "chart.heat_outlook.geography:main"
chart-publish-kenya = "chart.heat_outlook.publish:main"

[project.optional-dependencies]
handover = ["numpy>=1.26", "xarray>=2024.1", "netCDF4>=1.6", "geopandas>=1.0", "pyproj>=3.6", "shapely>=2.0"]
dev = [
  "black==25.1.0",
  "httpx>=0.27",
  "mypy==1.19.1",
  "pytest>=8",
  "ruff==0.14.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["chart*"]

[tool.setuptools.package-data]
"chart.solution_repository" = ["seed.json"]
"chart.learning" = ["seed.json"]
"chart.heat_outlook" = ["releases/*/*.json", "releases/*/*.csv"]
"chart.climate" = ["heat_seasons.json"]
"chart.vra" = ["catalogue.json"]
